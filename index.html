<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bể Cá 3D</title>
<style>
  :root{--panel:rgba(10,20,22,.72);--line:rgba(160,255,220,.14);--acc:#3fb58a;--txt:#dff5ee;--mut:rgba(223,245,238,.55)}
  html,body{margin:0;height:100%;background:#020606;overflow:hidden;font:13px -apple-system,system-ui,sans-serif;color:var(--txt)}
  #app canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
  .ui{transition:opacity .35s}
  body.noui .ui{opacity:0;pointer-events:none}
  #lib{position:fixed;top:12px;right:12px;bottom:12px;width:300px;display:flex;flex-direction:column;border-radius:16px;
    background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);overflow:hidden}
  #lib header{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  #lib header b{font-size:15px;letter-spacing:.02em}
  .seg{display:flex;background:rgba(255,255,255,.07);border-radius:8px;padding:2px}
  .seg button{background:none;border:0;color:var(--mut);font-size:11px;padding:4px 7px;border-radius:6px;cursor:pointer}
  .seg button.on{background:rgba(255,255,255,.14);color:var(--txt)}
  #tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--line)}
  #tabs button{background:rgba(255,255,255,.06);border:0;color:var(--mut);padding:6px 10px;border-radius:999px;cursor:pointer;font-size:12px}
  #tabs button.on{background:var(--acc);color:#fff}
  #body{flex:1;overflow:auto;padding:12px 14px}
  #foot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
  #foot button{flex:1}
  button.b{background:rgba(255,255,255,.08);border:0;color:var(--txt);padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12px}
  button.b:hover{background:rgba(255,255,255,.15)}
  button.pri{background:var(--acc)} button.pri:hover{background:#4cc99b}
  button.danger{background:rgba(255,90,90,.18);color:#ffc9c9}
  .add{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
  .list .li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;margin-bottom:3px;background:rgba(255,255,255,.04)}
  .list .li.on{background:rgba(63,181,138,.25);outline:1px solid rgba(63,181,138,.5)}
  .list i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .ed{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:7px 0}
  .row span{color:var(--mut);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--acc);margin:0}
  input[type=checkbox]{accent-color:var(--acc)}
  label.chk{display:flex;align-items:center;gap:8px;margin:7px 0;cursor:pointer}
  .lab{color:var(--mut);font-size:12px;margin:10px 0 6px}
  .sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sw b{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw b.on{border-color:#fff}
  .sw input[type=color]{width:28px;height:24px;border:0;background:none;padding:0;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .card{border-radius:10px;background:rgba(255,255,255,.05);padding:5px;cursor:pointer;text-align:center;border:1px solid transparent}
  .card:hover{background:rgba(255,255,255,.1)}
  .card.on{border-color:var(--acc);background:rgba(63,181,138,.18)}
  .card img,.card .img{width:100%;aspect-ratio:1;border-radius:7px;display:block;background:rgba(0,0,0,.25) center/cover;object-fit:cover}
  .card span{display:block;font-size:11px;margin-top:4px;line-height:1.2}
  .muted{color:var(--mut);font-size:12px;line-height:1.5;margin:0 0 10px}
  .segrow{display:flex;gap:6px;margin-top:6px}.segrow button{flex:1}
  .segrow button.on{background:var(--acc)}
  #bar{position:fixed;left:calc((100% - 324px)/2);bottom:16px;transform:translateX(-50%);white-space:nowrap;max-width:calc(100% - 350px);overflow-x:auto;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:14px;
    background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
  #bar[hidden]{display:none}
  #bar #barName{padding:0 8px 0 4px;font-weight:600}
  #bar button{min-width:30px;padding:7px 7px}
  body.noui #bar{left:50%}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;pointer-events:none;transition:opacity .3s}
  #toast:empty{opacity:0}
  #hint{position:fixed;left:calc(50% - 150px);top:50%;transform:translate(-50%,-50%);max-width:340px;padding:20px 22px;border-radius:16px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);line-height:1.6;text-align:center}
  #hint[hidden]{display:none}
  #hint h3{margin:0 0 6px;font-size:16px}
  #mgr{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:30;display:grid;place-items:center;backdrop-filter:blur(3px)}
  #mgr[hidden]{display:none}
  .mpanel{width:min(1040px,95vw);height:88vh;display:flex;flex-direction:column;background:#0b1514;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .mhead b{font-size:15px}.mtabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .mtabs button{background:rgba(255,255,255,.06);border:0;color:var(--mut);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12px}
  .mtabs button.on{background:var(--acc);color:#fff}
  #mbody{flex:1;overflow:auto;padding:14px 16px}
  #mfoot{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);min-height:42px}
  #mfoot span{flex:1;color:var(--mut);font-size:12px}
  #mfoot button{width:auto;padding:8px 14px}
  .mh{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}.mh:first-child{margin-top:0}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .mc{position:relative;display:flex;flex-direction:column;gap:3px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer}
  .mc.on{border-color:var(--acc)}.mc:not(.on):not(.ph):not(.sf){opacity:.6;border-color:rgba(255,90,90,.5)}
  .mc input[type=checkbox]{position:absolute;top:10px;left:10px;width:18px;height:18px}
  .mc img,.mc .dotbox{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:rgba(0,0,0,.3)}
  .mc .dotbox{background:radial-gradient(circle at 35% 35%,var(--c),#1b2a29)}
  .mc b{font-size:12px;font-weight:600;line-height:1.25}.mc small{margin:0;opacity:.6;font-size:11px;line-height:1.3}
  .mc a{color:#7fe3bd;font-size:12px}.mc select,.mc input[type=text],.mc input[type=number]{width:100%;box-sizing:border-box;background:#142321;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
  .mc .b{padding:6px;margin-top:2px}
  .tag{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;background:rgba(255,255,255,.1)}.tag.ok{background:rgba(63,181,138,.3)}.tag.warn{background:rgba(255,180,70,.3)}.tag.bad{background:rgba(255,90,90,.3)}
  .mtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .mtools input[type=text]{flex:1;min-width:180px;background:#142321;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .mtools select{background:#142321;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{background:rgba(255,255,255,.07);border:0;color:var(--txt);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px}.chips button.on{background:var(--acc)}
  .note{background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;margin-bottom:12px;color:var(--mut)}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#020606;color:#8fd;z-index:9;transition:opacity .5s}
</style>
</head>
<body>
<div id="app"></div>
<div id="vig"></div>
<div id="hint" class="ui" hidden><h3>Bể đang trống</h3>Mở <b>Thư viện</b> bên phải:<br>① <b>Đèn</b>: thêm đèn &nbsp;② <b>Nền</b>: rải nền<br>③ Bày <b>đá, lũa, cây, trang trí</b><br><span class="muted">Phím H: ẩn/hiện giao diện</span></div>
<aside id="lib" class="ui">
  <header><b>Thư viện</b><div class="seg" id="qual"></div></header>
  <nav id="tabs"></nav>
  <div id="body"></div>
  <div id="foot"><button class="b" id="mgrBtn">Mô hình…</button><button class="b" id="hideUi">Ẩn giao diện (H)</button><button class="b danger" id="clear">Xóa bể</button></div>
</aside>
<div id="bar" class="ui" hidden>
  <span id="barName"></span>
  <button class="b" data-a="rl" title="Xoay trái (Q)">⟲</button>
  <button class="b" data-a="rr" title="Xoay phải (E)">⟳</button>
  <button class="b" data-a="tf" title="Nghiêng về trước (W)">⤓</button>
  <button class="b" data-a="tb" title="Nghiêng về sau (S)">⤒</button>
  <button class="b" data-a="tl" title="Nghiêng trái (A)">⇤</button>
  <button class="b" data-a="tr" title="Nghiêng phải (D)">⇥</button>
  <button class="b" data-a="up" title="Dựng thẳng lại (R)">Dựng thẳng</button>
  <button class="b" data-a="sm" title="Nhỏ lại (−)">−</button>
  <button class="b" data-a="sp" title="To lên (+)">+</button>
  <button class="b" data-a="dup">Nhân bản</button>
  <button class="b danger" data-a="del">Xóa</button>
  <button class="b" data-a="x" title="Bỏ chọn (Esc)">✕</button>
</div>
<div id="toast" class="ui"></div>
<div id="mgr" hidden><div class="mpanel"><div class="mhead"><b>Quản lý mô hình</b><div class="mtabs" id="mtabs"></div><button class="b" id="mgrClose" style="width:auto;padding:6px 12px">Đóng ✕</button></div><div id="mbody"></div><div id="mfoot"></div></div></div>
<div id="boot">Đang dựng bể…</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries, mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

const V3=THREE.Vector3, TAU=Math.PI*2;
// Sương/hấp thụ ánh sáng của nước: chỉ tính trên đoạn tia nhìn nằm DƯỚI mặt nước (fogNear = mực nước, fogFar = độ hấp thụ)
THREE.ShaderChunk.fog_pars_vertex=`#ifdef USE_FOG
varying float vFogDepth;varying vec3 vFWorld;
#endif`;
THREE.ShaderChunk.fog_vertex=`#ifdef USE_FOG
vFogDepth=-mvPosition.z;vFWorld=(inverse(viewMatrix)*mvPosition).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment=`#ifdef USE_FOG
uniform vec3 fogColor;varying float vFogDepth;varying vec3 vFWorld;uniform float fogNear;uniform float fogFar;
#endif`;
// Nước chỉ nằm trong hộp bể: fogNear = mực nước + 1000*(nửa sâu), fogFar = độ hấp thụ + 1000*(nửa rộng)
THREE.ShaderChunk.fog_fragment=`#ifdef USE_FOG
{float wl=mod(fogNear,1000.),hd=floor(fogNear/1000.),Lab=mod(fogFar,1000.),hw=floor(fogFar/1000.);
 vec3 C=cameraPosition;vec3 d=vFWorld-C;float len=length(d);d+=vec3(1e-5);
 vec3 bmin=vec3(-hw,-1000.,-hd),bmax=vec3(hw,wl,hd),iv=1./d,ta=(bmin-C)*iv,tb=(bmax-C)*iv,tmin=min(ta,tb),tmax=max(ta,tb);
 float t0=max(max(tmin.x,tmin.y),max(tmin.z,0.)),t1=min(min(tmax.x,tmax.y),min(tmax.z,1.));
 float inside=max(0.,t1-t0)*len;
 float fogFactor=1.-exp(-inside/Lab);
 gl_FragColor.rgb=mix(gl_FragColor.rgb,fogColor,clamp(fogFactor,0.,1.));}
#endif`;
{const k='directLight.color = inSpotLightMap ? directLight.color * spotColor.rgb : directLight.color;';
 if(!THREE.ShaderChunk.lights_fragment_begin.includes(k))console.warn('caustic chunk not patched');
 THREE.ShaderChunk.lights_fragment_begin=THREE.ShaderChunk.lights_fragment_begin.replace(k,
 `#ifdef USE_FOG
 {float wl=mod(fogNear,1000.),hd=floor(fogNear/1000.),hw=floor(fogFar/1000.);vec3 wp=cameraPosition+transpose(mat3(viewMatrix))*geometryPosition;
 float cMask=(abs(wp.x)<hw&&abs(wp.z)<hd)?smoothstep(wl+1.,wl-1.5,wp.y):0.;
 directLight.color = inSpotLightMap ? directLight.color * mix(vec3(1.0),spotColor.rgb,cMask) : directLight.color;}
 #else
 directLight.color = inSpotLightMap ? directLight.color * spotColor.rgb : directLight.color;
 #endif`);}
let TW=120,TH=62,TD=56,CUT=0,BASEH=0;   // kích thước bể (đơn vị ~ cm), đổi theo kiểu bể
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------------- noise / rng ----------------
function hash3(x,y,z,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1440662683)+Math.imul(s,1013904223))|0;
  h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function noise3(x,y,z,s=0){
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz),h=(a,b,c)=>hash3(a,b,c,s);
  return lerp(lerp(lerp(h(ix,iy,iz),h(ix+1,iy,iz),u),lerp(h(ix,iy+1,iz),h(ix+1,iy+1,iz),u),v),
              lerp(lerp(h(ix,iy,iz+1),h(ix+1,iy,iz+1),u),lerp(h(ix,iy+1,iz+1),h(ix+1,iy+1,iz+1),u),v),w);
}
function fbm3(x,y,z,o=4,s=0){let a=.5,t=0,n=0;for(let i=0;i<o;i++){t+=a*noise3(x,y,z,s+i*7);n+=a;x*=2.03;y*=2.03;z*=2.03;a*=.5;}return t/n;}
function rng(seed){let s=(Math.imul(seed|0,2654435761)^0x9e3779b9)|0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}

// ---------------- kiểu bể ----------------
const TANK_PRESETS={
  aquarium:{name:'Bể cá chữ nhật',w:120,h:62,d:56,cut:0,base:'none',lid:false,frame:'sili',inner:'none',sides:false,view:'fill'},
  box:{name:'Hộp terrarium có nắp',w:72,h:38,d:38,cut:0,base:'wood',lid:true,frame:'metal',inner:'moss',sides:true,view:'show'},
  gem:{name:'Bể kính cắt góc',w:46,h:68,d:36,cut:10,base:'mahogany',lid:true,frame:'metal',inner:'moss',sides:true,view:'show'}};
const BASE_H={none:0,wood:4,mahogany:9,stone:3};
function applyTankDims(){
  const T=S.tank;TW=clamp(+T.w||72,30,160);TH=clamp(+T.h||38,20,100);TD=clamp(+T.d||38,20,90);
  CUT=clamp(+T.cut||0,0,Math.min(TW,TD)/2-8);BASEH=BASE_H[T.base]??0;
}
// ---------------- state ----------------
const DEF={tank:{preset:'box',...TANK_PRESETS.box},substrate:{type:'none',slope:.5,hill:0,hillX:0,rough:0,hm:null},
  water:{color:'#1f5a55',clarity:.55,ambient:.35,motes:350,bubbles:false,back:'room',room:.3,wall:'#8b9299',level:.9,clearTop:.35},
  lights:[],objects:[],fish:{},critters:{},quality:'mid',uid:1};
let S=structuredClone(DEF);
try{const s=JSON.parse(localStorage.getItem('aq3d')||'null');
  if(s)S={...S,...s,substrate:{...DEF.substrate,...s.substrate},water:{...DEF.water,...s.water},fish:{...(s.fish||{})},critters:{...(s.critters||{})}};
  if(s&&!s.tank)S.tank={preset:'aquarium',...TANK_PRESETS.aquarium};else if(s)S.tank={...DEF.tank,...s.tank};
  if(!['room','black','blue','teal','concrete'].includes(S.water.back))S.water.back='room';
  if(Array.isArray(S.substrate.hm)&&S.substrate.hm.length===121*57)S.substrate.hm=Float32Array.from(S.substrate.hm);else S.substrate.hm=null;}catch(e){}
applyTankDims();
const WL=()=>TH*clamp(S.water.level??.9,.03,1);
const WLu={value:TH*.9};
const tankOctOK=(x,z,m=0)=>{if(CUT<=0)return true;return Math.abs(x)+Math.abs(z)<=TW/2+TD/2-CUT-m*1.4142;};
function clampTankXZ(o,m=0){o.x=clamp(o.x,-TW/2+m,TW/2-m);o.z=clamp(o.z,-TD/2+m,TD/2-m);
  if(CUT>0){const e=Math.abs(o.x)+Math.abs(o.z)-(TW/2+TD/2-CUT-m*1.4142);if(e>0){o.x-=Math.sign(o.x)*e/2;o.z-=Math.sign(o.z)*e/2;}}return o;}
const FIRSTRUN=!localStorage.getItem('aq3d');
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('aq3d',JSON.stringify(S,(k,v)=>v instanceof Float32Array?Array.from(v,x=>Math.round(x*10)/10):v));}catch(e){}},300);}

const Q={low:{name:'Thấp',pr:1,shadow:0,bloom:false,fps:30,mirror:null},
         mid:{name:'Vừa',pr:Math.min(devicePixelRatio||1,1.5),shadow:1024,bloom:true,fps:30,mirror:[512,384,0]},
         high:{name:'Cao',pr:Math.min(devicePixelRatio||1,2),shadow:2048,bloom:true,fps:60,mirror:[1024,768,4]}};

// ---------------- renderer / scene ----------------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('#app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const envTex=(()=>{const p=new THREE.PMREMGenerator(renderer);const t=p.fromScene(new RoomEnvironment(),.04).texture;p.dispose();return t;})();
scene.fog=new THREE.Fog(0x0a1a18,100,300);
const camera=new THREE.PerspectiveCamera(36,1,1,800);
const hemi=new THREE.HemisphereLight(0xbfe8e0,0x3a2c1c,.4);scene.add(hemi);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.45,.55,.8);composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------- tank shell + căn phòng phía sau ----------------
const wallTex=(()=>{const W2=256,H2=256,c=document.createElement('canvas');c.width=W2;c.height=H2;const g=c.getContext('2d'),id=g.createImageData(W2,H2);
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){
    const n=.55+.5*(fbm3(x*.03,y*.03,0,4,3)-.5)+.12*(fbm3(x*.2,y*.2,1,2,9)-.5);

function woodGeo(seed){
  const r=rng(seed),s=seed%997,geos=[],pts=[];
  const p=new V3(-10+r()*3,-1.5,(r()-.5)*4),dir=new V3(1,1.2+r()*.5,(r()-.5)*.5).normalize();
  for(let i=0;i<7;i++){pts.push(p.clone());dir.x+=(r()-.5)*.5;dir.y+=(r()-.5)*.35;dir.z+=(r()-.5)*.4;dir.y=Math.max(dir.y,.3);dir.normalize();p.addScaledVector(dir,5+r()*2);}
  geos.push(woodTube(pts,2.3,.35,s));
  const nb=2+Math.floor(r()*2);
  for(let b=0;b<nb;b++){const q=pts[2+Math.floor(r()*4)].clone(),d=new V3((r()-.5)*2,.3+r()*.9,(r()-.5)*1.2).normalize(),bp=[q.clone()];
    for(let i=0;i<3;i++){d.x+=(r()-.5)*.6;d.y+=(r()-.5)*.4;d.normalize();q.addScaledVector(d,3.5+r()*2);bp.push(q.clone());}
    geos.push(woodTube(bp,1,.2,s+b+2));}
  for(let k=0;k<2;k++){const q=pts[0].clone(),d=new V3(-.5-r(),-.05,(r()-.5)*2).normalize(),rp=[q.clone()];
    for(let i=0;i<3;i++){q.addScaledVector(d,3+r()*1.5);q.y=Math.max(q.y-.3,-1.2);rp.push(q.clone());}
    geos.push(woodTube(rp,1.3,.3,s+9+k));}
  const g=mergeGeometries(geos).scale(1.55,1.55,1.55);
  return colorize(g,(x,y,z,nx,ny,nz,o)=>{
    const n=fbm3(x*.15,y*.15,z*.15,4,s+3);o.setRGB(lerp(.1,.3,n),lerp(.065,.2,n),lerp(.035,.12,n));
    const m=fbm3(x*.12,y*.12,z*.12,4,s+20);
    if(ny>.3&&m>.55)o.lerp(new THREE.Color(.035,.1,.02),clamp((ny-.3)*3,0,1)*clamp((m-.55)*7,0,1));});
}
function plantGeo(kind,seed){
  const r=rng(seed),B={p:[],n:[],c:[],s:[],ph:[],i:[]},C=(h,s,l)=>new THREE.Color().setHSL(h/360,s,l);
  const blade=(x,z,h,w,lean,nAng,prof,c0,c1,seg=8)=>{
    const nx=Math.cos(nAng),nz=Math.sin(nAng),wx=-nz,wz=nx,base=B.p.length/3,ph=r()*TAU,sw=Math.min(1.6,h/22);
    const nl=Math.hypot(nx,.5,nz);
    for(let k=0;k<=seg;k++){const t=k/seg,off=lean*h*t*t,cx=x+nx*off,cz=z+nz*off,cy=h*t*(1-lean*.25*t),ww=w*prof(t)*.5;
      B.p.push(cx-wx*ww,cy,cz-wz*ww,cx+wx*ww,cy,cz+wz*ww);B.n.push(nx/nl,.5/nl,nz/nl,nx/nl,.5/nl,nz/nl);
      const col=c0.clone().lerp(c1,t);B.c.push(col.r,col.g,col.b,col.r,col.g,col.b);B.s.push(t*sw,t*sw);B.ph.push(ph,ph);
      if(k<seg){const a=base+k*2;B.i.push(a,a+1,a+2,a+1,a+3,a+2);}}
  };
  const ribbon=t=>.4+.6*Math.pow(1-t,.6),sword=t=>Math.pow(Math.sin(Math.PI*Math.min(1,t*.97+.03)),.8);
  if(kind==='val')for(let i=0;i<30;i++){const a=r()*TAU,d=Math.sqrt(r())*4;
    blade(Math.cos(a)*d,Math.sin(a)*d,26+r()*24,.8+r()*.5,.1+r()*.3,r()*TAU,ribbon,C(125+r()*10,.5,.05),C(95+r()*20,.55,.3));}
  if(kind==='sword')for(let i=0;i<16;i++){const a=i/16*TAU+r()*.3;
    blade(Math.cos(a)*.6,Math.sin(a)*.6,14+r()*12,3+r()*1.6,.45+r()*.35,a,sword,C(125,.5,.05),C(105,.6,.28));}
  if(kind==='red')for(let i=0;i<22;i++){const a=r()*TAU,d=Math.sqrt(r())*2.5;
    blade(Math.cos(a)*d,Math.sin(a)*d,12+r()*10,1.4+r()*.4,.15+r()*.2,a,sword,C(355,.55,.1),C(15,.75,.36));}
  if(kind==='fern')for(let i=0;i<14;i++){const a=i/14*TAU+r()*.4;
    blade(Math.cos(a)*.5,Math.sin(a)*.5,9+r()*6,2.2+r()*.6,.5+r()*.3,a,sword,C(140,.45,.04),C(120,.5,.2));}
  if(kind==='carpet')for(let i=0;i<340;i++){const a=r()*TAU,d=Math.sqrt(r())*7;
    blade(Math.cos(a)*d,Math.sin(a)*d,1.2+r()*1.8,.45,.2+r()*.3,r()*TAU,ribbon,C(110,.6,.08),C(95,.7,.32),3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(B.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(B.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(B.c,3));g.setAttribute('aSway',new THREE.Float32BufferAttribute(B.s,1));
  g.setAttribute('aPhase',new THREE.Float32BufferAttribute(B.ph,1));g.setIndex(B.i);g.translate(0,-.4,0);return g;
}
function castleGeo(){
  const st='#a79a82',dk='#15110d',rf='#7a4a36',parts=[solid(new THREE.BoxGeometry(14,11,9).translate(0,5.5,0),st)];
  for(const x of [-8,8]){parts.push(solid(new THREE.CylinderGeometry(2.8,3,17,16).translate(x,8.5,0),st),
    solid(new THREE.ConeGeometry(3.5,5,16).translate(x,19.5,0),rf),solid(new THREE.BoxGeometry(1,2.2,.5).translate(x,12,2.9),dk));}
  for(let i=-3;i<=3;i++)for(const z of [4,-4])parts.push(solid(new THREE.BoxGeometry(1.4,1.6,1.2).translate(i*2,11.8,z),st));
  parts.push(solid(new THREE.BoxGeometry(3.6,5.5,.6).translate(0,2.75,4.4),dk));
  const g=mergeGeometries(parts);
  const a=g.attributes.color,P=g.attributes.position;
  for(let i=0;i<a.count;i++){const n=.8+.35*fbm3(P.getX(i)*.3,P.getY(i)*.3,P.getZ(i)*.3,3,4),m=P.getY(i)<3?.7:1;a.setXYZ(i,a.getX(i)*n*m,a.getY(i)*n,a.getZ(i)*n*m);}
  return g.translate(0,-.8,0);
}
function chestGeo(){
  const br='#5a3a22',gd='#c9a040';
  return mergeGeometries([solid(new THREE.BoxGeometry(8,5,5).translate(0,2.5,0),br),
    solid(new THREE.CylinderGeometry(2.5,2.5,8,20).rotateZ(Math.PI/2).translate(0,5,0),br),
    solid(new THREE.BoxGeometry(8.3,.45,5.3).translate(0,5,0),gd),
    ...[-3.2,3.2].map(x=>solid(new THREE.BoxGeometry(.6,5.3,5.3).translate(x,2.6,0),gd)),
    solid(new THREE.BoxGeometry(1.2,1.6,.4).translate(0,4.4,2.6),gd)]).translate(0,-.6,0);
}
function vaseGeo(){
  const pts=[[.01,0],[3,.2],[4.2,2],[4.6,4.5],[3.8,7],[2.2,8.6],[1.8,9.6],[2.4,10.2]].map(([x,y])=>new THREE.Vector2(x,y));
  const g=new THREE.LatheGeometry(pts,40).translate(0,-5,0).rotateZ(1.35).rotateY(.3);
  g.computeBoundingBox();g.translate(0,-g.boundingBox.min.y-.9,0);
  return colorize(g,(x,y,z,nx,ny,nz,o)=>{const n=fbm3(x*.3,y*.3,z*.3,3,8);o.setRGB(.34+.14*n,.12+.05*n,.05);});
}
function bubblerGeo(){return mergeGeometries([solid(new THREE.CylinderGeometry(1.6,2,2.2,20).translate(0,1.1,0),'#4a5358'),
  solid(new THREE.CylinderGeometry(1.3,1.3,.3,20).translate(0,2.3,0),'#1d2226')]).translate(0,-.4,0);}

function swayMat(){
  const m=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.6});
  m.onBeforeCompile=sh=>{sh.uniforms.uTime=U.uTime;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float uTime;attribute float aSway;attribute float aPhase;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nfloat sw=aSway*aSway;transformed.x+=sin(uTime*1.1+aPhase)*sw*1.6;transformed.z+=cos(uTime*.8+aPhase*1.3)*sw;');};
  return m;
}

function rebuildLib(){

  for(const e of CAT.items){const it=libCache[e.id]=Object.assign(libCache[e.id]||{foot:e.size*.45},e,{real:true,fixed:true});next.push(it);}

const gltfLoader=new GLTFLoader(),gltfP={},protoP={};
function loadFile(u){return gltfP[u]??=gltfLoader.loadAsync('models/'+u);}
function swayify(mat,h,amp){
  const m=mat.clone();
  m.onBeforeCompile=sh=>{sh.uniforms.uTime=U.uTime;sh.uniforms.uH={value:h};sh.uniforms.uAmp={value:amp};
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float uTime,uH,uAmp;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
      float sw=clamp(position.y/uH,0.,1.);sw*=sw;float ph=modelMatrix[3].x*.21+modelMatrix[3].z*.17;
      transformed.x+=sin(uTime*1.05+ph)*sw*uAmp;transformed.z+=cos(uTime*.8+ph*1.3)*sw*uAmp*.7;`);};
  m.customProgramCacheKey=()=>'sway';return m;
}
function proto(it){
  return protoP[it.id]??=loadFile(it.url).then(g=>{
    const src=it.node?g.scene.getObjectByName(it.node):g.scene;
    if(!src)throw new Error('không thấy '+it.node);
    const o=src.clone(true);if(it.node)o.position.set(0,0,0);
    const inner=new THREE.Group();inner.add(o);inner.updateMatrixWorld(true);
    let box=new THREE.Box3().setFromObject(inner),sz=box.getSize(new V3());
    const k=it.size/Math.max(sz.x,sz.y,sz.z);inner.scale.setScalar(k);inner.updateMatrixWorld(true);
    box.setFromObject(inner);sz=box.getSize(new V3());const c=box.getCenter(new V3());
    inner.position.set(-c.x,-box.min.y-(it.sink||0)*sz.y,-c.z);
    it.foot=Math.max(sz.x,sz.z)*.5;
    inner.traverse(n=>{if(!n.isMesh)return;n.castShadow=n.receiveShadow=true;
      if(it.sway){n.geometry.computeBoundingBox();const h=Math.max(.001,n.geometry.boundingBox.max.y);
        n.material=swayify(n.material,h,1.1/k);}});
    const p=new THREE.Group();p.add(inner);return p;
  });
}
const geoCache=new Map();
function makeRoot(id,seed){
  const it=LIBI[id];
  if(it.real){const root=new THREE.Group();
    proto(it).then(p=>{root.add(p.clone());onModelReady(root);})
      .catch(e=>{console.error(e);toast('Không tải được mô hình '+it.name,3000);});
    return root;}
  const key=it.fixed?id:id+':'+seed;
  let g=geoCache.get(key);if(!g){g=it.geo(seed);geoCache.set(key,g);}
  const m=new THREE.Mesh(g,MAT[it.mat]);m.castShadow=m.receiveShadow=true;
  const root=new THREE.Group();root.add(m);return root;
}

// ---------------- physics (Rapier) ----------------
// mỗi vật là một khối cứng rơi chậm như trong nước, va chạm theo vỏ lồi của mô hình
const HMAX=3,VFALL=8,VUP=2.5,WMAX=.7,DRAGSPD=20;
let world=null,fixedBody=null,groundCol=null,physAcc=0,wasMoving=false;
const bodies=new Map(),hullCache={};
let tankCols=[];
function buildTankColliders(){
  for(const c of tankCols)world.removeCollider(c,true);tankCols=[];
  const C=RAPIER.ColliderDesc,add=d=>tankCols.push(world.createCollider(d,fixedBody));
  add(C.cuboid(TW/2+4,3,TD/2+4).setTranslation(0,-3,0).setFriction(.95));
  for(const sx of [-1,1]){add(C.cuboid(3,TH*2,TD/2+4).setTranslation(sx*(TW/2+3),TH,0));add(C.cuboid(TW/2+4,TH*2,3).setTranslation(0,TH,sx*(TD/2+3)));}
  if(CUT>0){const Lc=TW/2+TD/2-CUT;
    for(const sx of [-1,1])for(const sz of [-1,1]){
      const nx=sx/1.4142,nz=sz/1.4142,cx=nx*(Lc/1.4142)+nx*1.5,cz=nz*(Lc/1.4142)+nz*1.5,th=Math.atan2(-sx,-sz);
      add(C.cuboid(CUT*.8+4,TH*2,1.5).setTranslation(cx,TH,cz).setRotation({x:0,y:Math.sin(th/2),z:0,w:Math.cos(th/2)}));}}
}
async function initPhysics(){
  await RAPIER.init();
  world=new RAPIER.World({x:0,y:-26,z:0});
  const ip=world.integrationParameters;ip.lengthUnit=10;ip.contact_natural_frequency=3;
  fixedBody=world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  buildTankColliders();
  rebuildGround();
  for(const o of S.objects)createBody(o);
}
function rebuildGround(){
  if(!world)return;
  if(groundCol){world.removeCollider(groundCol,true);groundCol=null;}
  if(subMesh){const g=subMesh.geometry;
    groundCol=world.createCollider(RAPIER.ColliderDesc.trimesh(new Float32Array(g.attributes.position.array),new Uint32Array(g.index.array)).setFriction(.95),fixedBody);}
  for(const {body} of bodies.values())body.wakeUp();
}
function hullPoints(o,root){
  const it=LIBI[o.item],key=it.fixed?o.item:o.item+':'+o.seed;
  if(hullCache[key])return hullCache[key];
  root.updateMatrixWorld(true);
  const inv=root.matrixWorld.clone().invert(),m=new THREE.Matrix4(),v=new V3(),pts=[];
  root.traverse(n=>{if(!n.isMesh||n.isInstancedMesh)return;m.multiplyMatrices(inv,n.matrixWorld);
    const P=n.geometry.attributes.position,step=Math.max(1,Math.floor(P.count/1500));
    for(let i=0;i<P.count;i+=step){v.fromBufferAttribute(P,i).applyMatrix4(m);pts.push(v.x,v.y,v.z);}});
  return hullCache[key]=new Float32Array(pts);
}
function colliderDesc(o,root){
  const it=LIBI[o.item],s=o.scale;let d;
  if(it.cat==='plant'){const r=clamp(it.foot*.22,.8,3)*s;d=RAPIER.ColliderDesc.cylinder(.5*s,r).setTranslation(0,.5*s,0);}
  else{const base=hullPoints(o,root),p=new Float32Array(base.length);for(let i=0;i<p.length;i++)p[i]=base[i]*s;
    d=RAPIER.ColliderDesc.convexHull(p)||RAPIER.ColliderDesc.ball(it.foot*.5*s);}
  return d.setFriction(.9).setRestitution(0).setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Min).setDensity(it.cat==='plant'?.5:2.2);
}
function hasMesh(root){let h=false;root.traverse(n=>{if(n.isMesh&&!n.isInstancedMesh)h=true;});return h;}
function createBody(o,awake){
  const root=rootOf(o.uid);if(!world||!root||bodies.has(o.uid)||!hasMesh(root))return;
  const it=LIBI[o.item];

  const pos=[],col=[],idx=[],r=rng(5),B=9;

    let tg=null,best=1e9;
    if(c.full<3)for(const p of food){if(!isT&&!p.rest)continue;const d=Math.hypot(p.x-c.x,p.z-c.z)+(isT?Math.abs(p.y-c.y)*.3:0);if(d<best){best=d;tg=p;}}
    let want=c.tgt,spdWant=0;
    if(tg&&best<90){want=isT?Math.atan2(-(tg.z-c.z),tg.x-c.x):Math.atan2(-(tg.z-c.z),tg.x-c.x)+(c.side>0?-Math.PI/2:Math.PI/2)*0;spdWant=isT?9:11;c.pause=0;
      if(best<c.size*.35){tg.eaten=true;c.full++;spawnBubble(c.x,c.y+2,c.z);}}
    else{
      if(c.timer<=0){c.tgt=c.ang+(Math.random()-.5)*2.2;c.timer=2+Math.random()*5;if(Math.random()<.35)c.pause=1+Math.random()*3;c.side=Math.random()<.5?1:-1;}
      want=c.tgt;spdWant=c.pause>0?0:(isT?(dep>12?6:3.2):5.5);
    }
    // tránh tường kính và vật lớn
    let rx=0,rz=0;const m=10;
    if(c.x<-TW/2+m)rx+=1;if(c.x>TW/2-m)rx-=1;if(c.z<-TD/2+m)rz+=1;if(c.z>TD/2-m)rz-=1;
    for(const sp of sph){const dx=c.x-sp[0],dz=c.z-sp[2],d=Math.hypot(dx,dz),lim=sp[3]+c.size*.7;if(d<lim&&d>1e-3&&Math.abs(c.y-sp[1])<sp[3]+c.size*.5){rx+=dx/d*(lim-d)/lim*2;rz+=dz/d*(lim-d)/lim*2;}}
    if(rx||rz){want=Math.atan2(-rz,rx);spdWant=Math.max(spdWant,3);}
    // cua đi ngang: hướng thân vuông góc hướng di chuyển
    const turn=wrapA(want-c.ang);c.ang+=clamp(turn,-1,1)*dt*(isT?1.1:1.6);
    c.speed+=(spdWant-c.speed)*Math.min(1,dt*2.5);
    let mvx,mvz;
    if(isT){mvx=Math.cos(c.ang);mvz=-Math.sin(c.ang);}
    else{mvx=Math.sin(c.ang)*c.side;mvz=Math.cos(c.ang)*c.side;}
    c.x=clamp(c.x+mvx*c.speed*dt,-TW/2+5,TW/2-5);c.z=clamp(c.z+mvz*c.speed*dt,-TD/2+5,TD/2-5);
    // độ cao + kiểu di chuyển
    const g2=subH(c.x,c.z),d2=WL()-g2;
    let ty;
    if(isT){c.mode=d2>13?'swim':'walk';
      ty=c.mode==='swim'?clamp(g2+6+(Math.sin(t*.13+c.phase)*.5+.5)*(d2-15),g2+4,WL()-6):g2+c.size*.12;}
    else{c.mode='walk';ty=g2+c.size*.085;}
    const oy=c.y;c.y+=(ty-c.y)*Math.min(1,dt*(c.mode==='swim'?1.2:6));
    c.root.position.set(c.x,c.y,c.z);
    c.root.rotation.y=c.ang;
    // hoạt ảnh
    const sw=c.speed/(isT?6:6),rate=c.mode==='swim'?2.2:5;c.phase+=dt*(.6+sw*rate);const ph=c.phase;
    if(isT){
      c.root.rotation.z=clamp((c.y-oy)/dt*.05,-.35,.35);
      const L=U.limbs,flap=c.mode==='swim'?Math.sin(ph*1.4)*.75*(.3+sw):Math.sin(ph*2)*.25*sw,sweep=c.mode==='swim'?Math.cos(ph*1.4)*.25:Math.sin(ph*2)*.55*sw;
      L.fl.rotation.x=flap;L.fr.rotation.x=-flap;L.fl.rotation.y=-sweep;L.fr.rotation.y=sweep;
      L.bl.rotation.y=Math.sin(ph*2+Math.PI)*.4*sw;L.br.rotation.y=-Math.sin(ph*2)*.4*sw;L.bl.rotation.x=L.br.rotation.x=c.mode==='swim'?Math.sin(ph*1.4+1)*.2:0;
      U.head.rotation.y=Math.sin(t*.4+c.phase)*.25;U.head.rotation.z=Math.sin(ph*2)*.05*sw;U.body.position.y=Math.sin(ph*2)*.008*sw;
    }else{
      for(const l of U.legs){const s2=l.p.userData.side,i=l.p.userData.i,k=Math.sin(ph*2+(i%2?Math.PI:0)+(s2>0?0:Math.PI*.5));
        l.p.rotation.y=k*.35*sw*s2;l.knee.rotation.x=Math.max(0,Math.cos(ph*2+(i%2?Math.PI:0)))*.4*sw*s2;}
      c.wave-=dt;if(c.pause>0&&Math.random()<dt*.6)c.wave=1.6;
      for(const cl of U.claws){const w=c.wave>0?Math.sin(t*9)*.35:0;cl.wrist.rotation.z=w;cl.p.rotation.y=(c.wave>0?-.35:0)*cl.side*.0+Math.sin(ph*2)*.05*sw;cl.p.rotation.x=(c.wave>0?-.5:0)*cl.side;}
    }
  }
}

let tR,tS,tC;const thumbCache={};
async function thumb(id){
  if(thumbCache[id])return thumbCache[id];
  const it=LIBI[id];if(it.real){try{await proto(it);}catch(e){return '';}}
  if(!tR){tR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});tR.setPixelRatio(2);tR.setSize(96,96);
    tR.outputColorSpace=THREE.SRGBColorSpace;tR.toneMapping=THREE.ACESFilmicToneMapping;
    tS=new THREE.Scene();tS.add(new THREE.HemisphereLight(0xdff5ee,0x332211,1.6));
    const d=new THREE.DirectionalLight(0xffffff,2.6);d.position.set(3,6,5);tS.add(d);tC=new THREE.PerspectiveCamera(30,1,.1,1000);}
  const o=it.real?(await proto(it)).clone():makeRoot(id,777);tS.add(o);
  const sph=new THREE.Box3().setFromObject(o).getBoundingSphere(new THREE.Sphere());
  const dist=sph.radius/Math.sin(THREE.MathUtils.degToRad(15))*1.02;
  tC.position.set(sph.center.x+dist*.3,sph.center.y+dist*.3,sph.center.z+dist*.9);tC.lookAt(sph.center);
  tR.render(tS,tC);tS.remove(o);return thumbCache[id]=tR.domElement.toDataURL();
}
let thumbRun=0;
async function fillThumbs(){const run=++thumbRun,imgs=[...document.querySelectorAll('img[data-thumb]:not([src])')];
  for(const im of imgs){if(run!==thumbRun)return;const u=await thumb(im.dataset.thumb);if(u&&im.isConnected)im.src=u;
    await new Promise(r=>setTimeout(r,10));}}

function guessCat(cs){if(cs.includes('rocks'))return 'rock';if(cs.some(c=>['plants','trees','flowers','grass','ground cover'].includes(c)))return 'plant';return 'decor';}
async function mgrApply(){
  const {rm,rs}=mgrChanges();if(!rm.length&&!rs.length)return;
  const rmReal=rm.filter(e=>e.real&&e.url);
  const keep=new Set([...CAT.items.filter(it=>!rm.some(r=>r.kind==='item'&&r.id===it.id)).map(it=>pathOf(it.url)),...(CAT.fish||[]).filter(fi=>!rm.some(r=>r.kind==='fish'&&r.id===fi.id)).map(fi=>pathOf(fi.url))]);
  const del=[...new Set(rmReal.map(e=>pathOf(e.url)))].filter(p=>!keep.has(p)),bytes=del.reduce((a,p)=>a+(SIZES[p]||0),0);
  if(!confirm(`Xóa ${rm.length} mục khỏi thư viện${del.length?` và xóa file khỏi máy (${fmtMB(bytes)})`:''}?${rs.length?`\nKhôi phục ${rs.length} mục dựng sẵn.`:''}\nCác vật đang đặt trong bể thuộc mục bị xóa cũng sẽ bị gỡ.`))return;
  try{
    if(del.length)await api('api/delete',{method:'POST',body:JSON.stringify({paths:del})});
    for(const e of rm){
      if(e.kind==='item'){
        for(const o of [...S.objects].filter(o=>o.item===e.id))removeObject(o.uid);
        if(e.real){CAT.items=CAT.items.filter(it=>it.id!==e.id);delete libCache[e.id];delete protoP[e.id];if(e.url)delete gltfP[e.url];}
        else CAT.hidden.push(e.id);
      }else if(e.kind==='fish'){
        if(e.real){CAT.fish=CAT.fish.filter(fi=>fi.id!==e.id);removeSpecies(e.id);}
        else{CAT.hidden.push(e.id);S.fish[e.id]=0;}
      }else if(e.kind==='crit'){CAT.hidden.push(e.id);S.critters[e.id]=0;}
    }
    for(const e of rs)CAT.hidden=CAT.hidden.filter(h=>h!==e.id);
    await saveCatalog();rebuildLib();syncFish();syncCritters();mgr.sel=new Map();refreshAll();save();
    toast(`Đã áp dụng${bytes?`, giải phóng ${fmtMB(bytes)}`:''}`,3500);await mgrRefresh();
  }catch(e){toast('Lỗi: '+e.message,5000);}

async function phDownload(id){
  const a=mgr.ph.find(x=>x.id===id);if(!a||mgr.busy)return;
  const cat=document.querySelector(`[data-phcat="${id}"]`)?.value||guessCat(a.cats);
  mgr.busy='dl:'+id;renderMgr();
  try{
    const info=await api('api/phinfo?id='+id);
    if(!confirm(`Tải "${a.name}" về máy?\nDung lượng: ${fmtMB(info.bytes)} (Poly Haven, CC0)${a.poly>200000?`\nLưu ý: ${Math.round(a.poly/1000)}K tam giác, khá nặng.`:''}`)){mgr.busy='';renderMgr();return;}
    toast('Đang tải '+a.name+'…');
    const r=await api('api/polyhaven',{method:'POST',body:JSON.stringify({id})});
    r.nodes.forEach((n,i)=>{const multi=r.nodes.length>1,eid='ph_'+id+(multi?'_'+(i+1):''),sz=clamp(Math.round(Math.max(...n.size)*100*.25),6,55);
      CAT.items.push({id:eid,cat,name:a.name+(multi?' '+(i+1):''),url:r.url,node:multi?n.name:null,size:sz,sink:cat==='plant'?0:.05,...(cat==='plant'?{sway:1}:{})});});
    await saveCatalog();rebuildLib();refreshAll();SIZES=await api('api/sizes');
    toast(`Đã thêm "${a.name}" (${r.nodes.length} mục) vào thư viện`,3500);
  }catch(e){toast('Lỗi: '+e.message,5000);}
  mgr.busy='';renderMgr();
}
async function sfSearch(q){
  mgr.sfQ=q;mgr.busy='sf';renderMgr();
  try{mgr.sf=await api('api/sf?q='+encodeURIComponent(q));}catch(e){toast('Không tìm được: '+e.message,4000);mgr.sf=[];}
  mgr.busy='';renderMgr();
}
async function inboxLoad(){try{mgr.inbox=await api('api/inbox');SIZES=await api('api/sizes');}catch(e){mgr.inbox=[];}renderMgr();}
async function inboxAdd(i){
  const L=mgr.inbox.filter(x=>x.path.startsWith('inbox/')),x=L[i],q=k=>document.querySelector(`[data-${k}="${i}"]`);
  const name=(q('ibn').value||'Mô hình').trim(),type=q('ibt').value,size=clamp(+q('ibs').value||15,2,80),flip=q('ibf').checked,id=(type==='fish'?'fish_':'user_')+Date.now().toString(36);
  if(type==='fish')CAT.fish.push({id,name,url:x.path,len:size,spd:8,flip,max:6,dot:'#cfd8dc',band:[.3,.8]});
  else CAT.items.push({id,cat:type,name,url:x.path,node:null,size,sink:type==='plant'?0:.05,...(type==='plant'?{sway:1}:{})});
  try{await saveCatalog();rebuildLib();applyCatalogFish();refreshAll();toast(`Đã thêm "${name}"`,2500);}catch(e){toast('Lỗi: '+e.message,4000);}
  renderMgr();
}

document.getElementById('mgrClose').onclick=closeMgr;
MGR.addEventListener('mousedown',e=>{if(e.target===MGR)closeMgr();});
MGR.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.key){mgr.sel.set(t.dataset.key,t.checked);renderMgr();}
  if(t.id==='phsort'){mgr.phSort=t.value;mgr.phMax=60;renderMgr();}

MGR.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='phq'){mgr.phQ=e.target.value;mgr.phMax=60;renderMgr();}
  if(e.key==='Enter'&&e.target.id==='sfq')sfSearch(e.target.value);
});
MGR.addEventListener('click',e=>{
  const t=e.target.closest('[data-mgrp],[data-mtab],[data-mapply],[data-phc],[data-phdl],[data-phmore],[data-sfq],[data-sfgo],[data-openinbox],[data-ibrefresh],[data-ibadd]');if(!t)return;const d=t.dataset;
  if(d.mgrp){const [c,v]=d.mgrp.split(':');for(const en of mgrEntries().act)if(en.cat===c)mgr.sel.set(en.key,v==='1');renderMgr();}
  else if(d.mtab){mgr.tab=d.mtab;renderMgr();if(d.mtab==='ph')phLoad();if(d.mtab==='inbox')inboxLoad();if(d.mtab==='sf'&&!mgr.sf)sfSearch(mgr.sfQ);}
  else if('mapply' in d)mgrApply();
  else if(d.phc){mgr.phCat=d.phc;mgr.phMax=60;renderMgr();}
  else if(d.phdl)phDownload(d.phdl);
  else if('phmore' in d){mgr.phMax+=60;renderMgr();}
  else if(d.sfq){document.getElementById('sfq')&&(document.getElementById('sfq').value=d.sfq);sfSearch(d.sfq);}
  else if('sfgo' in d)sfSearch(document.getElementById('sfq').value);
  else if('openinbox' in d)api('api/open',{method:'POST',body:JSON.stringify({path:'inbox'})}).catch(e=>toast('Lỗi: '+e.message,3000));
  else if('ibrefresh' in d)inboxLoad();
  else if(d.ibadd!==undefined)inboxAdd(+d.ibadd);
});


// ---------------- nền tường bên trong bể (rêu 3D, đá phiến, vỏ bần, đen) ----------------
const INNER={none:{name:'Trong suốt'},moss:{name:'Tường rêu'},slate:{name:'Đá phiến'},cork:{name:'Vỏ bần / gỗ'},black:{name:'Đen mờ'}};
function innerEdges(){
  const T=S.tank,pts=footprint(.2),n=pts.length,out=[];
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n],mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2,dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);
    const front=mz>TD/2-2.2||(mz>0&&Math.abs(dx)>1e-6&&Math.abs(dz)>1e-6);   // mặt trước và hai góc cắt phía trước bỏ trống
    const back=mz<-TD/2+2.2;
    if(front||(!back&&!T.sides))continue;
    let ry=Math.atan2(-dz,dx);const nx=Math.sin(ry),nz=Math.cos(ry);if(nx*mx+nz*mz>0)ry+=Math.PI;   // pháp tuyến hướng vào trong
    out.push({a,b,mx,mz,len,ry,nx:Math.sin(ry),nz:Math.cos(ry)});
  }
  return out;
}
function buildInnerWalls(){
  const T=S.tank;if(!T.inner||T.inner==='none')return;
  const edges=innerEdges(),addM=m=>{m.castShadow=false;m.receiveShadow=true;m.userData.keepGeo=false;shellG.add(m);return m;};
  for(const e of edges){
    let mat;
    if(T.inner==='moss'){const t=subTex('moss'),map=t.map.clone(),bump=t.bump.clone();for(const x of [map,bump]){x.needsUpdate=true;x.repeat.set(e.len/t.rep,TH/t.rep);}
      mat=new THREE.MeshStandardMaterial({map,bumpMap:bump,bumpScale:3,roughness:1,color:new THREE.Color(.8,.9,.75)});}
    else if(T.inner==='black')mat=new THREE.MeshStandardMaterial({color:0x060707,roughness:.92});
    else mat=texMat(T.inner,e.len/32,TH/32,{bump:3,rough:.9,side:THREE.DoubleSide});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(e.len,TH),mat);
    p.position.set(e.mx,TH/2,e.mz);p.rotation.y=e.ry;addM(p);
  }
  // rêu 3D phủ nổi lên trên tường: lớp nền sẫm to + lớp hạt sáng nhỏ
  if(T.inner==='moss'&&S.quality!=='low'){
    const area=edges.reduce((a,e)=>a+e.len*TH,0),cap=S.quality==='high'?9000:5500,N=Math.min(cap,Math.round(area/.55));
    if(N>20){
      const m=new THREE.InstancedMesh(mossGeo,mossMat,N);m.userData.keepGeo=true;m.frustumCulled=false;m.raycast=()=>{};
      const tot=edges.reduce((a,e)=>a+e.len,0),r=rng(77),q=new THREE.Quaternion(),UP=new V3(0,1,0),nv=new V3(),pv=new V3(),sv=new V3(),mat4=new THREE.Matrix4(),col=new THREE.Color();
      for(let i=0;i<N;i++){
        let u=r()*tot,e=edges[0];for(const ed of edges){if(u<=ed.len){e=ed;break;}u-=ed.len;}
        const t=u/e.len,h=.8+r()*(TH-1.6),dx=e.b[0]-e.a[0],dz=e.b[1]-e.a[1],big=r()<.3,sz=big?.8+r()*.7:.28+r()*.5;
        const px=e.a[0]+dx*t,pz=e.a[1]+dz*t;
        nv.set(e.nx+(r()-.5)*.9,(r()-.5)*.9,e.nz+(r()-.5)*.9).normalize();q.setFromUnitVectors(UP,nv);
        pv.set(px+e.nx*sz*(big?.2:.5),h,pz+e.nz*sz*(big?.2:.5));sv.set(sz,sz*(.8+r()*.5),sz);mat4.compose(pv,q,sv);m.setMatrixAt(i,mat4);
        const pal=big?MOSSPAL[1]:MOSSPAL[r()<.55?0:r()<.5?2:3],j=big?.45+r()*.3:.6+r()*.8;col.setRGB(pal[0]*j,pal[1]*j,pal[2]*j);m.setColorAt(i,col);
      }
      m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;m.castShadow=false;m.receiveShadow=true;shellG.add(m);
    }
  }
}

// ---------------- bể mẫu (giống ảnh tham khảo) ----------------
const TEMPLATES={

    substrate:{type:'moss',slope:.32,hill:.4,hillX:.2,rough:.5},water:{level:.03,room:.1,back:'concrete',ambient:1.0},
    lights:[{type:'goose',x:-6,z:-2,h:15,intensity:11,angle:46,color:'#fff4dc'}],
    objects:[['ph_trunk2',6,-3,.78,-.55],['ph_anth2',-2,-8,1.5,0],['ph_fern1',-24,-4,1.5,.4],['ph_fern3',26,-9,1.4,2],['ph_cala1',-14,7,1.3,1],['ph_mossA3',-8,10,.8,.3],['ph_grs1',18,9,1.4,0],['ph_grs2',9,12,1.3,1],['ph_grs3',-26,10,1.4,2],['ph_moss',0,13,1.6,0],['ph_peri2',14,-12,1.2,1]]},
  terra2:{name:'Kính cắt góc',tank:'gem',
    substrate:{type:'moss',slope:.5,hill:.85,hillX:.25,rough:.6},water:{level:.03,room:.08,back:'concrete',ambient:.95},
    lights:[{type:'goose',x:0,z:2,h:16,intensity:10,angle:40,color:'#fff4dc'},{type:'accent',x:15,z:-9,h:12,intensity:2.6,color:'#4a7bff'}],
    objects:[['ph_bould5',-11,4,1.1,.4],['ph_bould6',8,10,.9,1.2],['ph_peri1',3,0,1.9,0],['ph_cala2',-12,-6,1.3,.8],['ph_fern2',11,6,1.5,2.2],['ph_anth1',-3,9,1.3,1],['ph_grs2',-14,11,1.4,0],['ph_grs3',2,13,1.4,1],['ph_face2',-4,-12,.7,.2]]}
};
function applyTemplateData(T){
  S.tank={preset:T.tank,...TANK_PRESETS[T.tank]};
  S.substrate={...DEF.substrate,...T.substrate,hm:null};
  S.water={...DEF.water,...T.water};
  S.lights=T.lights.map(l=>({id:S.uid++,caustics:true,rays:l.type!=='accent',angle:LTYPE[l.type].angle,...l}));
  const q=new THREE.Quaternion();
  S.objects=[];for(const [item,x,z,sc,yaw] of T.objects){if(!LIBI[item])continue;
    q.setFromAxisAngle(AX.y,yaw);S.objects.push({uid:S.uid++,item,seed:(Math.random()*1e9)|0,x,z,y:(subH(x,z,S.substrate)||0)+2,q:[q.x,q.y,q.z,q.w],scale:sc,_awake:true});}
}
function loadTemplate(id){
  const T=TEMPLATES[id];if(!T)return;
  if(!confirm(`Thay toàn bộ bể hiện tại bằng bể mẫu "${T.name}"?`))return;
  cancelPlacing();selectObj(null);if(brush.on)setBrush(false);if(tb.on)setTerrainBrush(false);
  for(const L of [...S.lights]){const o=LO.get(L.id);if(o){for(const m of [o.spot,o.target,o.cone,o.handle,o.arm])if(m)scene.remove(m);if(o.arm)disposeGroup(o.arm);LO.delete(L.id);}}
  for(const o of [...S.objects]){const r=rootOf(o.uid);if(r){scene.remove(r);objRoots.splice(objRoots.indexOf(r),1);}removeBody(o.uid);}
  S.fish={};S.critters={};syncFish();syncCritters();
  applyTemplateData(T);
  applyTankDims();
  for(const L of S.lights)buildLight(L);
  applyTank();
  for(const o of S.objects){applyTankDims();spawnObject(o);}
  selLight=S.lights[0]?.id??null;refreshAll();save();
}
// ---------------- rêu 3D phủ trên mặt nền (khi chọn nền rêu) ----------------
let floorMoss=null;
function buildFloorMoss(){
  if(floorMoss){scene.remove(floorMoss);floorMoss.dispose();floorMoss=null;}
  if(S.substrate.type!=='moss'||S.quality==='low')return;
  const cap=S.quality==='high'?8000:5000,N=Math.min(cap,Math.round(TW*TD*1.7)),wl=WL(),r=rng(31);
  const m=new THREE.InstancedMesh(mossGeo,mossMat,N);m.frustumCulled=false;m.raycast=()=>{};
  const q=new THREE.Quaternion(),UP=new V3(0,1,0),nv=new V3(),pv=new V3(),sv=new V3(),mat4=new THREE.Matrix4(),col=new THREE.Color();let n=0;
  for(let i=0;i<N;i++){
    const p={x:(r()-.5)*TW,z:(r()-.5)*TD};clampTankXZ(p,.8);const y=subH(p.x,p.z);if(y<wl+.2)continue;
    const e=.7,gx=subH(p.x+e,p.z)-subH(p.x-e,p.z),gz=subH(p.x,p.z+e)-subH(p.x,p.z-e);
    nv.set(-gx/(2*e)+(r()-.5)*.5,1,-gz/(2*e)+(r()-.5)*.5).normalize();q.setFromUnitVectors(UP,nv);
    const big=r()<.25,sz=big?.7+r()*.6:.3+r()*.5;
    pv.set(p.x,y-sz*.1,p.z);sv.set(sz,sz*(.7+r()*.5),sz);mat4.compose(pv,q,sv);m.setMatrixAt(n,mat4);
    const pal=big?MOSSPAL[1]:MOSSPAL[r()<.6?0:r()<.5?2:3],j=big?.5+r()*.3:.65+r()*.75;col.setRGB(pal[0]*j,pal[1]*j,pal[2]*j);m.setColorAt(n,col);n++;
  }
  m.count=n;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;m.castShadow=false;m.receiveShadow=true;
  floorMoss=m;scene.add(m);
}
// ---------------- đổi kiểu / kích thước bể ----------------
let tankT=0;
function applyTank(){
  applyTankDims();
  glassBottom.geometry.dispose();glassBottom.geometry=footprintGeo();
  surface.geometry.dispose();surface.geometry=footprintGeo().rotateX(Math.PI);
  buildTankShell();fillMotes();
  FBX[0]=-TW/2+7;FBX[1]=TW/2-7;FBZ[0]=-TD/2+6;FBZ[1]=TD/2-6;
  makeMirror();buildSubstrate();
  if(world)buildTankColliders();
  for(const L of S.lights){clampTankXZ(L,3);if(LO.get(L.id)){LO.get(L.id).angle=null;syncLight(L);}}
  for(const o of S.objects){clampTankXZ(o,3);const r=rootOf(o.uid);if(r)applyTransform(o,.5);}
  for(const fi of fishes){clampTankXZ(fi,6);fi.y=Math.min(fi.y,TH-3);}
  for(const c of critters)clampTankXZ(c,6);
  camReset();resize();save();
}
function applyTankSoon(){clearTimeout(tankT);tankT=setTimeout(applyTank,120);}
function setTankPreset(id){S.tank={preset:id,...TANK_PRESETS[id]};if(id!=='aquarium'&&S.water.level>.5)S.water.level=.04;if(id==='aquarium'&&S.water.level<.2)S.water.level=.9;camReset();applyTank();refreshAll();}
// ---------------- quality / resize ----------------
function applyQuality(){
  const q=Q[S.quality];renderer.setPixelRatio(q.pr);composer.setPixelRatio(q.pr);
  renderer.shadowMap.enabled=q.shadow>0;for(const L of S.lights)syncLight(L);
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});makeMirror();resize();
}
const camBase=new V3(),look=new V3(0,TH*.5,-TD*.25),lookT=new V3(),camState={zoom:1,px:0,py:0};
let fitD=100,fitC=new V3(),camEl=0;
function camFit(){
  const w0=innerWidth,uiPad=(typeof uiOn!=='undefined'&&uiOn&&w0>760)?336:0,asp=camera.aspect*(w0-uiPad)/w0,tf=Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
  if(S.tank.view==='show'){
    const gh=S.lights.reduce((m,l)=>LTYPE[l.type].arm?Math.max(m,lightY(l)+4):m,0),top=Math.max(TH+(S.tank.lid?4:0),gh),totH=top+BASEH,totW=TW+(BASEH>0?9:4);
    fitD=Math.max(totH*1.28/(2*tf),totW*1.3/asp/(2*tf));fitC.set(0,(top-BASEH)/2,0);camEl=.1;
  }else{
    const visH=Math.min(TH,TW/asp)/1.1;camD=visH/(2*tf);fitD=camD+TD*.75;fitC.set(0,TH*.5,-TD*.25);camEl=0;
  }
}
function camTargets(){
  camFit();
  const zmin=Math.max(.1,(TD/2+4)/fitD),z=clamp(camState.zoom,zmin,1.8);camState.zoom=z;
  const D=fitD*z;
  camState.px=clamp(camState.px,-TW*.6,TW*.6);camState.py=clamp(camState.py,-TH*.7,TH*.7);
  lookT.set(fitC.x+camState.px,fitC.y+camState.py,fitC.z);
  camBase.set(lookT.x,lookT.y+Math.sin(camEl)*D,lookT.z+Math.cos(camEl)*D);
}
function camReset(){camState.zoom=1;camState.px=0;camState.py=0;camTargets();}
function zoomAt(e){
  setNdc(e);const o=ray.ray.origin,d=ray.ray.direction;if(Math.abs(d.z)<1e-4)return;
  const t=(lookT.z-o.z)/d.z,P=o.clone().addScaledVector(d,t),z0=camState.zoom;
  camState.zoom=z0*Math.exp(e.deltaY*.0016);camTargets();
  const k=1-camState.zoom/z0;if(k>0){camState.px+=(P.x-lookT.x)*k;camState.py+=(P.y-lookT.y)*k;}
  else{camState.px*=.92;camState.py*=.92;}
  camTargets();
}
function applyViewOffset(){const w=innerWidth,h=innerHeight;if(typeof uiOn!=='undefined'&&uiOn&&w>760)camera.setViewOffset(w,h,168,0,w,h);else camera.clearViewOffset();camera.updateProjectionMatrix();}
function resize(){
  const w=innerWidth,h=innerHeight;if(!w||!h)return false;
  renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w/2,h/2);
  camera.aspect=w/h;camera.updateProjectionMatrix();applyViewOffset();camTargets();
  const sc=h*renderer.getPixelRatio()*.25;foodPts.material.uniforms.uScale.value=sc;moteMat.uniforms.uScale.value=sc;bubMat.uniforms.uScale.value=sc*1.6;
  applyWater();return true;
}
addEventListener('resize',resize);

// ---------------- loop ----------------
let last=0;const cp=new V3();
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const q=Q[S.quality];if(now-last<1000/q.fps-4)return;
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;U.uTime.value=t;
  cp.set(camBase.x+mouse.x*2.2*camState.zoom,camBase.y-mouse.y*1.3*camState.zoom,camBase.z);
  camera.position.lerp(cp,Math.min(1,dt*3));look.lerp(lookT,Math.min(1,dt*4));camera.lookAt(look);
  {const under=camera.position.y<WL();for(const m of mirrors){m.visible=(m.userData.up!==under);m.material.uniforms.uTime.value=t;}}
  stepPhysics(dt);updateFish(dt,t);updateBubbles(dt,t);
  if(q.shadow&&S.lights.some(l=>l.caustics)){cMat.uniforms.uTime.value=t;renderer.setRenderTarget(causticRT);renderer.render(cScene,cCam);renderer.setRenderTarget(null);}
  if(q.bloom)composer.render();else renderer.render(scene,camera);
}

// ---------------- boot ----------------
(async function boot(){
  if(location.protocol==='file:'){$('#boot').innerHTML='<div style="text-align:center;line-height:1.7;max-width:420px">Mở bể bằng file <b>“Mở Bể Cá.command”</b><br>trong thư mục Aquarium trên Desktop<br><span style="opacity:.6">(trình duyệt không cho trang mở trực tiếp đọc mô hình 3D)</span></div>';return;}
  if(!resize()){setTimeout(boot,100);return;}
  await initCatalog();
  if(FIRSTRUN&&S.objects.length===0&&S.lights.length===0){S.uid=Math.max(S.uid,1);applyTemplateData(TEMPLATES.terra1);applyTankDims();}
  buildTankShell();camTargets();
  camera.position.copy(camBase);look.copy(lookT);camera.lookAt(look);
  buildSubstrate();for(const L of S.lights)buildLight(L);for(const o of S.objects)spawnObject(o);
  syncFish();syncCritters();
  initPhysics().catch(e=>{console.error(e);toast('Không bật được vật lý',4000);});
  applyQuality();refreshAll();
  const b=$('#boot');b.style.opacity=0;setTimeout(()=>b.remove(),600);
  requestAnimationFrame(frame);
  window.__aq={loadTemplate,TEMPLATES,camState,camReset,applyTank,setTankPreset,clampTankXZ,mgr,openMgr,CAT:()=>CAT,rebuildLib,LIB:()=>LIB,FISH,tb,setTerrainBrush,terrainStamp,terrainEnd,subH,camBase,look,critters,setCritterCount,mirrors:()=>mirrors,setBrush,brush,brushHit,mossStamp,ray,WL,makeMirror,fishes,food,dropFood,setFishCount,camera,bodies,get world(){return world;},objRec,S,scene,addLight,startPlacing,commitPlacing,spawnObject,refreshAll,buildSubstrate,frame,renderer,objAction,selectObj,setUi};
})();
